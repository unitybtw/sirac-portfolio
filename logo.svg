<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Tokyo Night Gradients -->
    <linearGradient id="tokyo-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73daca" />
      <stop offset="100%" stop-color="#bb9af3" />
    </linearGradient>
    <linearGradient id="tokyo-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e64" />
      <stop offset="100%" stop-color="#ff5555" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="ide-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow (subtle) -->
  <rect x="5" y="15" width="90" height="70" rx="8" ry="8" fill="url(#tokyo-cyan-violet)" opacity="0.08" filter="url(#ide-glow)" />

  <!-- IDE Window Frame -->
  <rect x="5" y="15" width="90" height="70" rx="8" ry="8" stroke="url(#tokyo-cyan-violet)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Header Separator -->
  <line x1="5" y1="32" x2="95" y2="32" stroke="url(#tokyo-cyan-violet)" stroke-width="2" opacity="0.5" />

  <!-- Mac-style Window Controls -->
  <circle cx="16" cy="23.5" r="3.5" fill="#f7768e" />
  <circle cx="26" cy="23.5" r="3.5" fill="#ff9e64" />
  <circle cx="36" cy="23.5" r="3.5" fill="#9ece6a" />

  <!-- Developer Code Symbol: < S > style inside the editor area -->
  <!-- Left Bracket < -->
  <path d="M 26,45 L 17,52.5 L 26,60" 
        fill="none" 
        stroke="#73daca" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#ide-glow)" />

  <!-- Right Bracket > -->
  <path d="M 74,45 L 83,52.5 L 74,60" 
        fill="none" 
        stroke="#73daca" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#ide-glow)" />

  <!-- High-end fluid geometric S monogram in the center -->
  <path d="M 55,42 
           C 51,37.5 43,37.5 39.5,43 
           C 36,48.5 46,51.5 49.5,53.5 
           C 53,55.5 60.5,58.5 57.5,64.5 
           C 54.5,70.5 45.5,70.5 41,66.5" 
        fill="none" 
        stroke="url(#tokyo-orange)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ide-glow)" />
</svg>
