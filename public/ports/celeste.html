<script>
window.addEventListener('unhandledrejection', () => {
  const message = document.createElement('p');
  message.textContent = 'Game could not load. Check your connection and use Restart to try again.';
  message.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;padding:12px;background:#fff;color:#222;font:14px sans-serif;z-index:99999';
  document.body.appendChild(message);
}, {once:true});
</script>
<style>
html, body { margin:0; background:#111; }
#loading-text, #loading-textt { position:fixed; inset:0; margin:0 !important; display:grid; place-content:center; padding:24px; font:16px/1.5 system-ui !important; color:#fff !important; background:#111 !important; -webkit-text-fill-color:#fff !important; -webkit-text-stroke:0 !important; animation:none !important; z-index:5; }
</style>
