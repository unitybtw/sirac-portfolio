<!-- Entry adapter from https://github.com/web-ports/terraria. Game runtime and assets remain upstream. -->
<!doctype html>
<html lang="en">
	<head>
<script src="sandbox-storage.js"></script>
<base href="https://cdn.jsdelivr.net/gh/web-ports/terraria@47731568354ea43e84e73a99a9e63328351d7194/">
		<meta charset="UTF-8" />
		<link rel="icon" href="./app.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta property="og:title" content="Terrarium" />
		<meta
			property="og:description"
			content="Terraria port for WebAssembly. Play Terraria online in the browser."
		/>
		<meta
			name="description"
			content="Terraria port for WebAssembly. Play Terraria online in the browser."
		/>
		<style>
			html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#game-container, iframe, canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
		</style>
		<link rel="canonical" href="https://terraria.mercurywork.shop" />
		<title>Terrarium</title>
		<script type="module" crossorigin src="main.js"></script>
	</head>

	<body>
		<div id="app"></div>
		<canvas id="canvas" style="width: 100%">

		</canvas>
	</body>
</html>
<style>
html,body { margin:0; }
#loading-text, #loading-textt { font:16px/1.5 system-ui !important; -webkit-text-fill-color:currentColor !important; -webkit-text-stroke:0 !important; animation:none !important; background:none !important; }
</style>
<script>
window.addEventListener('unhandledrejection', () => {
 const message=document.createElement('p');
 message.textContent='Game could not load. Use Restart or try again later.';
 message.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;padding:12px;background:#fff;color:#222;font:14px sans-serif;z-index:99999';
 document.body.appendChild(message);
}, {once:true});
</script>
