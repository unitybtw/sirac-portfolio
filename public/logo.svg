<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Nordic Aurora Gradients -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Nordic Glow Filter -->
    <filter id="nordic-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow (subtle) -->
  <circle cx="50" cy="50" r="40" fill="url(#glow-grad)" opacity="0.15" filter="url(#nordic-glow)" />

  <!-- Outer Glowing Hexagon Track -->
  <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" 
           fill="none" 
           stroke="url(#aurora-grad)" 
           stroke-width="4.5" 
           stroke-linecap="round" 
           stroke-linejoin="round"
           filter="url(#nordic-glow)" />

  <!-- Nordic Dots on Hexagon Corners -->
  <circle cx="50" cy="8" r="3.5" fill="#34d399" />
  <circle cx="88" cy="30" r="3.5" fill="#f59e0b" />
  <circle cx="12" cy="70" r="3.5" fill="#2dd4bf" />
  <circle cx="50" cy="92" r="3.5" fill="#f59e0b" />

  <!-- High-end fluid geometric S monogram -->
  <path d="M 65,30 
           C 58,22 42,22 36,32 
           C 30,42 45,47 50,50 
           C 55,53 70,58 64,68 
           C 58,78 42,78 35,70" 
        fill="none" 
        stroke="url(#aurora-grad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#nordic-glow)" />
</svg>
